<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="برگه آزمایش خون خود را ارسال کنید تا هر نتیجه به زبان ساده فارسی، فقط با اعداد روی همان برگه، توضیح داده شود.">
<title>توضیح آزمایش خون</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="hero">
    <h1>توضیح آزمایش خون</h1>
    <p>فایل PDF یا عکس آزمایش خود را ارسال کنید تا هر مورد به زبان ساده و دقیق فارسی توضیح داده شود. فقط اعداد روی برگه استفاده می‌شود؛ بدون تشخیص و بدون توصیه درمانی.</p>
  </header>

  <section class="card">
    <form id="form">
      <label class="upload" for="file" id="uploadBox">
        <div class="icon">📄</div>
        <strong>انتخاب فایل آزمایش</strong>
        <span class="hint">PDF یا عکس (JPG, PNG, WEBP) · حداکثر ۱۰ مگابایت</span>
        <span class="filename" id="filenameBox"></span>
        <input id="file" name="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/*" required>
      </label>
      <button id="submit" type="submit">تحلیل آزمایش</button>
      <button id="sampleBtn" type="button" class="secondary">برگه نمونه</button>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-label">
          <span id="progressStepName">در حال آماده‌سازی…</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div id="message" role="status" aria-live="polite"></div>
    </form>
  </section>

  <section id="results" class="hidden">
    <div class="card">
      <div class="section-header">
        <h2>خلاصه گزارش</h2>
        <span class="count-pill" id="countPill"></span>
      </div>
      <div class="stats-bar" id="statsBar"></div>
      <div id="summary" class="summary-box"></div>
      <div id="tests"></div>
      <div id="limitations"></div>
      <div class="actions">
        <button id="copyBtn" type="button" class="secondary">کپی خلاصه</button>
        <button id="printBtn" type="button" class="secondary">چاپ / ذخیره PDF</button>
      </div>
    </div>
    <p id="disclaimer" class="footer-note"></p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
